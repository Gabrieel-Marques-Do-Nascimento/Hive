[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  targetPort = 3000  # Se seu frontend roda em outra porta, ajuste aqui
  functionsPort = 9999

[[redirects]]
  from = "/api/*"
  to = "${API_URL}/:splat"
  status = 200
  force = true
  headers = {Access-Control-Allow-Origin = "*", Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"}

